<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paracino</title>
<style>
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #000; }
  img {
    display: block; max-width: 100vw; max-height: 100dvh;
    /* steps() = righe visibili, durata = velocità del "modem" */
    animation: load 12s steps(240) both;
  }
  @keyframes load {
    from { clip-path: inset(0 0 100% 0); }
    to { clip-path: inset(0); }
  }
  @media (prefers-reduced-motion: reduce) { img { animation: none; } }
</style>
</head>
<body>
<img src="photo.jpg" alt="Cappello di paglia, torso nudo e una molla arcobaleno tesa tra le mani">
</body>
</html>
